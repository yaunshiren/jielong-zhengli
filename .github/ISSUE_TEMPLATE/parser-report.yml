name: 接龙格式问题（匿名示例）
description: 用虚构/匿名化内容说明不能识别的编号格式
title: "[解析问题] "
body:
  - type: markdown
    attributes:
      value: "这里是公开页面，请勿贴真实姓名、电话、微信号、群聊截图、订单信息或任何隐私资料。"
  - type: textarea
    id: anonymized-input
    attributes:
      label: 完全匿名化的原始格式
      placeholder: "1. 张三+1
2、李四 待确认"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认以上仅含虚构或彻底匿名化的信息
          required: true
